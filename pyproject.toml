[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-career"
version = "0.1.0"
description = "A Python package for analyzing tennis players' career matches"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "matplotlib",
    "requests"
]

[tool.setuptools.packages.find]
include = ["tennis_career*"]